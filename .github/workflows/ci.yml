name: Community Market CI

on:
  push:
  pull_request:

jobs:
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project governance
        run: |
          test -s AGENTS.md
          test -s docs/QUALITY_GATE.md
          test -s README.md
      - name: Check Python syntax and run tests when source exists
        shell: bash
        run: |
          if [ -f requirements.txt ] && [ -f backend/main.py ] && [ -f test_product.py ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt pytest httpx
            python -m compileall -q backend
            python -m pytest -q test_product.py
          else
            echo "::notice::Application source not uploaded yet. App tests skipped; quality gate not passed."
          fi
      - name: Check JavaScript syntax when frontend exists
        shell: bash
        run: |
          if [ -f frontend/app.js ]; then
            node --check frontend/app.js
          else
            echo "::notice::Frontend source not uploaded yet."
          fi
