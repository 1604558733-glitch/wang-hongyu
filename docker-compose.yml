services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: community_marketplace
    ports:
      - "5432:5432"
    volumes:
      - community_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  community_pgdata:
